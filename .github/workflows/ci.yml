name: CI

# Builds the app and runs the tests on every push and pull request, on the
# same macOS and Xcode generation the app is developed on (the code uses the
# macOS 26 SDK). Tests that read this Mac's own sensors skip themselves here:
# a CI virtual machine has no temperature sensors or Now Playing.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (0 warnings)
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log
          count=$(grep -c "warning:" build.log || true)
          echo "Warnings: $count"
          # The project keeps to zero warnings, so a new one fails the build.
          if [ "$count" -gt 0 ]; then
            grep "warning:" build.log | sort -u | head -40
            echo "::error::swift build reported $count warning(s); the project keeps to 0"
            exit 1
          fi

      - name: Test
        run: swift test

  screenshots:
    # Every main-window page at three window sizes, from the real app
    # (DEBUG `-renderPages`), uploaded as an artifact to review UI changes
    # without sitting at the Mac.
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: swift build

      - name: Render pages
        run: |
          mkdir -p screenshots
          # Watchdog: the harness quits by itself; this only guards a hang.
          ( sleep 900; pkill -f ".build/debug/AllSet" ) &
          .build/debug/AllSet -renderPages "$PWD/screenshots" -AppleLanguages '(en)'
          ls screenshots | head -80
          test "$(ls screenshots | wc -l)" -gt 0

      - uses: actions/upload-artifact@v4
        with:
          name: page-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 14
